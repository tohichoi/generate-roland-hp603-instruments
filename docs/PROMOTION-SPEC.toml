# PROMOTION-SPEC.toml
# MIDI Instrument Definition Generator - ATD 포트폴리오 연동 단일 규격 (SSOT)
#
# 편입 프레임: Adopted Project
#   디렉터(Mike)가 2019-10 에 시작해 2025-10~12 에 확장한 개인 도구를
#   ATD 허브에 편입하여 분석 / 감사 / 문서화를 수행한 사례.
#   ATD 는 프로토콜 분석과 구현에 참여하지 않았으며, participating_agents 에는
#   편입 이후 실제로 수행한 기여만 기재한다.
#
# 논지: 코드가 아니라 도메인 지식이 결과물의 상한을 결정한다.
#   MIDI bank select 프로토콜을 역분석해 Roland / Yamaha 별 악기 선택
#   주소 체계를 Cakewalk 용 .ins 로 구현한 것이 이 프로젝트의 값어치이다.

[project]
id = "midi-instrument-definition-generator"
title = "MIDI Instrument Definition Generator"
subtitle = "MIDI bank select 프로토콜을 역분석해 Roland·Yamaha 디지털피아노의 악기 선택 체계를 Cakewalk용 .ins로 구현한 단독 개발 도구"
category = "AI & Automation"
status = "Completed"
case_study_badge = "ATD Adopted Project"
development_time = "2단계 (2019.10 / 2025.12)"
cost_reduction = "산정 제외 (개인 프로젝트)"
lead_director = "Mike (Managing Director)"
thumbnail = "assets/thumbnail.jpg"
live_demo_url = ""
repository_url = "https://github.com/tohichoi/generate-roland-hp603-instruments"
video_demo = ""
pdf_report = ""

[[participating_agents]]
name = "Atlas"
role = "Chief Strategy Officer"
contribution = "로컬-원격 기준선 불일치를 발견해 원격으로 정정하고, 829건 악기 주소를 전수 집계해 벤더별 bank 분할 구조를 규명, ATD 편입 파이프라인 편성과 대외 케이스 스터디 저술 및 감사 결과 종합"

[[participating_agents]]
name = "Leo"
